.ddh{display:flex;justify-content:space-between;align-items:center;padding:22px 18px 16px;font-weight:800;font-size:1.1rem;color:var(--p);border-bottom:1px solid var(--b);background:var(--hero)}

.hh .gr{font-size:.75rem;color:var(--a);letter-spacing:.6px;margin-bottom:10px;font-weight:600}
.hh .av.lg{box-shadow:0 0 0 5px rgba(124,58,237,.1),0 0 30px var(--pg)}
.ht{cursor:pointer;user-select:none}.ht h1{color:var(--p);font-size:1.4rem;text-shadow:0 0 15px var(--pg)}
.sub{font-size:.72rem;color:var(--s)}.ru{font-size:.72rem;color:var(--a);font-style:italic;margin-top:5px}
.banner{border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid var(--b);background:var(--banner);box-shadow:var(--card-shadow)}
.banner b{font-size:1.2rem;display:block;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(12px);box-shadow:var(--card-shadow)}
.g2,.g4{display:grid;gap:10px;margin-bottom:12px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.g2 .card{margin:0}

.tile b{display:block;font-size:1.3rem;color:var(--a)}.tile span{font-size:.7rem;color:var(--s);text-transform:uppercase}
.lb{font-size:.78rem;color:var(--a);font-weight:700;margin-bottom:6px}
.big{font-size:1.5rem;font-weight:800;color:var(--p)}.big.sm{font-size:1.05rem}.p{color:var(--p)}
.fx{display:flex;align-items:center;gap:14px}.fx>div:last-child{flex:1}
.donut{border-radius:50%;display:grid;place-items:center;flex-shrink:0;transition:background .3s}
.donut>div{width:68%;height:68%;border-radius:50%;background:var(--inner);display:grid;place-items:center;font-size:.82rem;text-align:center;transition:background .3s}
.leg div{display:flex;align-items:center;gap:6px;font-size:.75rem;margin:3px 0}.leg i{width:9px;height:9px;border-radius:50%}.leg em{margin-left:auto;font-style:normal;color:var(--s)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{background:var(--card);border:1px solid var(--b);color:var(--s);padding:8px 14px;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--card-shadow)}
.tabs button.on{background:linear-gradient(135deg,var(--p),#7c3aed);color:#fff;border-color:transparent}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qa button,.btn{background:var(--card);border:1px solid var(--b);color:var(--t);padding:14px 8px;border-radius:12px;font-weight:700;font-size:.82rem;cursor:pointer;box-shadow:var(--card-shadow)}
.btn{background:linear-gradient(135deg,var(--a),#0284c7);color:#fff;border:0;padding:11px 16px;white-space:nowrap}
.qa button{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--qa)}.qa button i{font-style:normal;font-size:1.4rem}.btn{display:inline-flex;align-items:center;justify-content:center}
.sr{display:flex;gap:8px;margin-bottom:12px}
input[type=text],input[type=number],select,textarea{background:var(--inner2);border:1px solid var(--b);color:var(--t);padding:11px 13px;border-radius:10px;font-size:.88rem;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 10px var(--pg)}
input::placeholder,textarea::placeholder{color:var(--s);opacity:.7}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--b);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer;align-items:flex-start;transition:transform .15s;box-shadow:var(--card-shadow)}
.row:active{transform:scale(.99)}

.ri{flex:1;min-width:0}.rt{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rs{font-size:.72rem;color:var(--s);margin-top:3px}
.pill{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#fff;padding:1px 8px;border-radius:50px;font-size:.72rem;font-weight:800}
.pc{font-size:.75rem;color:var(--p);font-weight:700}
.bar{height:6px;background:var(--bar);border-radius:3px;overflow:hidden;margin:7px 0}
.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--p));border-radius:3px}
.act{display:flex;gap:6px}.act button{flex:1;background:var(--act);border:1px solid var(--b);color:var(--t);padding:6px 4px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer}
.act button.e{flex:.5;color:var(--a);border-color:var(--ag)}.act button:disabled{opacity:.6;cursor:default}.act button.m{flex:.35}
.loader{text-align:center;padding:40px 10px;color:var(--a);font-weight:600}

.rec{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;box-shadow:var(--card-shadow)}.rec b{display:block;font-size:1.05rem;color:var(--p);margin-top:4px}
.menu{background:var(--card);border:1px solid var(--b);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow)}.menu button{display:flex;width:100%;justify-content:space-between;padding:14px;background:0;border:0;border-bottom:1px solid var(--line);color:var(--t);font-size:.88rem;cursor:pointer}

<style id="yuki-splash-early">
/* splash styles live here (before the splash markup) so the very first paint already looks right */
@keyframes ySpinR{to{transform:rotate(360deg)}}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ySpinA{to{--ang:360deg}}
#splash .spb{display:block}

/* splash */
#splash{background-color:#06050f!important;background-image:radial-gradient(70% 38% at 50% -4%,rgba(79,70,229,.52),transparent 70%),radial-gradient(60% 34% at 2% 52%,rgba(20,184,166,.50),transparent 72%),radial-gradient(60% 34% at 100% 58%,rgba(217,70,239,.46),transparent 72%),radial-gradient(70% 28% at 32% 78%,rgba(245,158,11,.38),transparent 72%)!important;gap:0!important}
#splash .spw{position:relative;width:min(54vw,220px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:34px}
#splash .spw::before{content:"";position:absolute;inset:-7%;border-radius:46px;border:1px dashed rgba(255,255,255,.24);}
#splash .spo{position:absolute;z-index:0;inset:0;border-radius:34px;background:conic-gradient(from var(--ang),#a855f7,#ec4899,#f59e0b,#22d3ee,#6366f1,#a855f7);animation:ySpinA 7s linear infinite}
#splash .spi{width:91%!important;position:relative;z-index:1;border-radius:27px!important;box-shadow:0 0 0 4px #07060f,0 0 26px rgba(168,85,247,.3)!important}
#splash .spt{font-size:2.1rem;font-weight:300;letter-spacing:.55em;padding-left:.55em;line-height:1.1;color:transparent;text-shadow:none;background:linear-gradient(90deg,#a78bfa,#f472b6 55%,#fb923c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#splash .spg{margin-top:14px;font-size:.78rem;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}

function dupGroups(){const m={};animeList.forEach((a,i)=>{const id=(a.siteUrl||'').match(/anilist\.co\/anime\/(\d+)/),k=id?'a'+id[1]:'n'+String(a.name).toLowerCase().replace(/[^a-z0-9\u0080-\uffff]/g,'');(m[k]=m[k]||[]).push(i)});const g=Object.values(m).filter(v=>v.length>1);const n={};animeList.forEach((a,i)=>{const k=String(a.name).toLowerCase().replace(/[^a-z0-9\u0080-\uffff]/g,'');(n[k]=n[k]||new Set()).add(i)});return g}
function openDup(){closeDropdownMenu();let o=$('dupO');if(!o){o=document.createElement('div');o.id='dupO';o.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o)}const G=dupGroups();o.innerHTML=`<div style="background:var(--sheet);border:1px solid var(--b);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;overflow:auto;padding:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>🧹 Duplicate Finder</b><button class="ib" aria-label="Close" onclick="$('dupO').remove()">✕</button></div>${G.length?`<button class="btn" style="width:100%;margin-bottom:10px" onclick="autoDup()">✨ Auto-clean (keep most progress)</button>`+G.map(g=>`<div class="card">${g.map(i=>{const a=animeList[i];return`<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><img loading="lazy" decoding="async" src="${esc(a.cover||PH)}" style="width:40px;height:56px;object-fit:cover;border-radius:6px"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:.85rem">${esc(a.name)}</div><div class="sub">${a.category} · ${a.watched||0}/${a.total||'?'} eps</div></div><button class="btn" style="padding:8px 10px;background:var(--d)" onclick="rmDup(${i})">Remove</button></div>`}).join('')}</div>`).join(''):'<div class="sub" style="text-align:center;padding:20px">No duplicates found ✅</div>'}</div>`}
function rmDup(i){animeList.splice(i,1);saveStorage();render();openDup();toast('🗑️ Removed')}
function autoDup(){const rm=new Set();dupGroups().forEach(g=>{const k=g.slice().sort((x,y)=>(animeList[y].watched||0)-(animeList[x].watched||0)||(animeList[y].rewatch||0)-(animeList[x].rewatch||0));k.slice(1).forEach(i=>rm.add(i))});animeList=animeList.filter((_,i)=>!rm.has(i));saveStorage();render();openDup();toast('🧹 '+rm.size+' duplicates removed')}

function post(url,headers,body,timeoutMs=25000){return new Promise((res,rej)=>{
 const x=new XMLHttpRequest();x.open('POST',url);x.setRequestHeader('Content-Type','application/json');
 for(const h in headers)x.setRequestHeader(h,headers[h]);
 x.timeout=timeoutMs;
 x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
  if(x.status>=200&&x.status<300)res(j);else{const er=new Error(j?.error?.message||('Error '+x.status));er.busy=x.status===429||x.status===503||x.status===500||/high demand|overloaded|unavailable|try again later|quota/i.test(er.message);er.nf=x.status===404||/does not exist|not found|no endpoints|decommission|deprecat|no longer/i.test(er.message);rej(er)}};
 x.onerror=()=>rej(new Error('Network error. Check your internet and try again.'));
 x.ontimeout=()=>rej(new Error('Timed out, please try again'));
 x.send(JSON.stringify(body));
})}
async function viaGemini(turns,so){
 const key=gm();
 // Google AI Studio now issues AQ authorization keys. Those use the Interactions API
 // and x-goog-api-key header; the older AIza format uses generateContent.
 if(/^AQ\./i.test(key)){
  const transcript=turns.map(t=>(t.r==='u'?'Friend':'Yuki')+': '+t.t).join('\n\n');
  let d,ie;
  for(const m of ['gemini-2.5-flash','gemini-3-flash-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-flash-latest','gemini-4-argon']){
   try{d=await post('https://generativelanguage.googleapis.com/v1beta/interactions',{'x-goog-api-key':key},{model:m,system_instruction:(so||sys()),input:transcript,generation_config:{temperature:0.55,max_output_tokens:1500},store:false});ie=null;break}
   catch(e){ie=e;if(!(e.nf||e.busy))break;await new Promise(r=>setTimeout(r,e.busy?1200:0))}
  }
  if(ie)throw ie;
  const direct=(d.output_text||'').trim();
  if(direct)return direct;
  const steps=Array.isArray(d.steps)?d.steps:[];
  const texts=[];
  steps.forEach(st=>{if(st.type==='model_output'&&Array.isArray(st.content))st.content.forEach(p=>{if(p.type==='text'&&p.text)texts.push(p.text)})});
  const out=texts.join('').trim();
  if(out)return out;
  throw new Error(d.error?.message||'Gemini returned an empty reply');
 }
 let c=[];turns.forEach(t=>{const r=t.r==='u'?'user':'model';if(c.length&&c[c.length-1].role===r)c[c.length-1].parts[0].text+='\n'+t.t;else c.push({role:r,parts:[{text:t.t}]})});
 while(c.length&&c[0].role!=='user')c.shift();
 let le;
 for(const m of GEM_MODELS){
  try{
   const d=await post('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),{},{systemInstruction:{parts:[{text:(so||sys())}]},contents:c,generationConfig:Object.assign({temperature:0.55,maxOutputTokens:1500},/^gemini-2\.5-flash$/.test(m)?{thinkingConfig:{thinkingBudget:0}}:{})});
   const t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
   if(t)return t;le=new Error('Empty reply from Gemini')
  }catch(e){le=e;if(!(e.nf||e.busy))break}
 }
 throw le;
}

const needsFacts=t=>t.length>6&&/\b(who|president|prime minister|current|currently|latest|newest|now|today|news|score|price|winner|won|release|released|when|weather)\b/i.test(t)&&!/\b(you|your|yuki|we|us)\b/i.test(t);
const FACTS=f=>'\nFACTS from a live web search done just now (trust these over your own memory, use them to answer in character, and do not mention that you searched): '+f;
function readInter(d){
 const direct=(d.output_text||'').trim();if(direct)return direct;
 const tx=[];
 (Array.isArray(d.steps)?d.steps:[]).forEach(st=>{if(st.type==='model_output'&&Array.isArray(st.content))st.content.forEach(p=>{if(p.type==='text'&&p.text)tx.push(p.text)})});
 (Array.isArray(d.outputs)?d.outputs:[]).forEach(o=>{if(o.type==='text'&&o.text)tx.push(o.text)});
 return tx.join('').trim();
}
async function gemSearch(q){
 const key=gm();if(!key)return '';
 const prompt='Today is '+new Date().toDateString()+'. Using Google Search, answer briefly (2-4 sentences, plain English) with the most up-to-date facts for this question: '+q;
 try{
  if(/^AQ\./i.test(key)){
   for(const m of ['gemini-3-flash-preview','gemini-2.5-flash']){
    try{const d=await post('https://generativelanguage.googleapis.com/v1beta/interactions',{'x-goog-api-key':key},{model:m,input:prompt,tools:[{type:'google_search'}],store:false});const t=readInter(d);if(t)return t}
    catch(e){if(!(e.nf||e.busy||/tool|search|ground/i.test(e.message)))break}
   }
  }else{
   const d=await post('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{},{contents:[{role:'user',parts:[{text:prompt}]}],tools:[{google_search:{}}]});
   const t=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();if(t)return t;
  }
 }catch(e){}
 return '';
}
async function wikiSearch(q){
 const d=await getJSON('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exchars=500&format=json&origin=*');
 const pg=d&&d.query&&d.query.pages;if(!pg)return '';
 return Object.values(pg).sort((a,b)=>a.index-b.index).map(p=>p.title+': '+(p.extract||'').replace(/\s+/g,' ')).join('\n').slice(0,1500);
}
async function lookup(q){
 let t='';try{t=await withTimeout(gemSearch(q),25000)}catch(e){}
 if(!t){try{t=await withTimeout(wikiSearch(q),12000)}catch(e){}}
 return t;
}
async function genEnglish(turns){
 const order_=order();
 const last=[...turns].reverse().find(x=>x.r==='u');
 let facts='',tried=false,le=null;
 if(last&&needsFacts(last.t)){tried=true;facts=await lookup(last.t)}
 for(const p of order_){
  try{
   let so=sysEN()+(facts?FACTS(facts):'');
   let o=await withTimeout(run(p,turns,{quick:true,sys:so}),30000);
   const m=o&&o.match(/^\s*SEARCH:\s*(.+)/i);
   if(m&&!tried){
    tried=true;facts=await lookup(m[1].trim());
    so=sysEN()+(facts?FACTS(facts):'\nNo live search is available right now: answer from what you know and say you are not sure it is up to date.');
    o=await withTimeout(run(p,turns,{quick:true,sys:so}),30000);
   }else if(m){o=''}
   if(o&&!/^\s*SEARCH:/i.test(o)&&!isLoop(o))return o;
  }catch(e){le=e}
 }
 throw le||new Error('No provider answered');
}
const siOk=t=>{const si=(t.match(/[඀-෿]/g)||[]).length,la=(t.match(/[A-Za-z]/g)||[]).length;return si>=2&&si/(si+la)>=0.12&&!badSi(t)&&!isLoop(t)};
async function toSinhala(en,turns){
 const all=order();
 for(let round=0;round<3;round++){
  const ps=round===0?all:all.slice(round%all.length).concat(all.slice(0,round%all.length));
  const res=[];
  await new Promise(done=>{
   let left=ps.length,timer=null;const fin=()=>{if(timer)clearTimeout(timer);done()};
   (round===0?ps:ps.slice(0,1)).forEach(p=>withTimeout(run(p,[{r:'u',t:'English: '+en}],{quick:true,sys:SI_TR+siTone()}),30000).then(t=>{t=cleanOut(String(t)).replace(/^\s*Sinhala\s*[:：]\s*/i,'');if(t){res.push({p,t});if(p==='gemini'&&siOk(t))fin();else if(!timer)timer=setTimeout(fin,4000)}},()=>{}).finally(()=>{if(--left===0)fin()}));
   if(round>0)left=1;
  });
  const c=res.slice().sort((x,y)=>all.indexOf(x.p)-all.indexOf(y.p));
  const good=c.filter(x=>siOk(x.t));
  const gg=good.find(x=>x.p==='gemini');if(gg){srcP='gemini';return gg.t}
  if(good.length)return good.length===1?(srcP=good[0].p,good[0].t):await pickBest(turns,good,en);
  await new Promise(r=>setTimeout(r,600));
 }
 return null;
}
async function viaSinhala(turns){
 if(!hasKey())throw new Error('Add at least one API key in API Settings');
 if((provider()==='auto'||provider()==='gemini')&&keyOf('gemini')){
  /* v22: Gemini-first for the best Sinhala: two tries, each proofread; other AIs only if both fail */
  const last=[...turns].reverse().find(x=>x.r==='u');
  let facts='';if(last&&needsFacts(last.t)){try{facts=await withTimeout(lookup(last.t),12000)}catch(e){}}
  for(let k=0;k<2;k++){
   try{
    const o=cleanOut(await withTimeout(run('gemini',turns,{sys:sys()+'\n\n'+SI_HELP+(facts?FACTS(facts):'')}),k?20000:26000));
    if(o&&siOk(o)){srcP='gemini';return await proof(o,turns)}
    gemErr='Gemini did not reply in Sinhala';
   }catch(e){gemErr=(e&&e.message)||'Gemini failed'}
  }
 }
 const en=await genEnglish(turns);
 const si=await toSinhala(en,turns);
 if(si)return si;
 for(const p of order()){
  try{const o=cleanOut(await withTimeout(run(p,turns,{quick:true,sys:sys()+'\n\n'+SI_HELP}),22000));if(o&&siOk(o)){srcP=p;return o}}catch(e){}
 }
 throw new Error('Could not create a Sinhala reply. Please try again or check your AI provider keys.');
}
async function proof(draft,turns){
 try{
  if(!keyOf('gemini')||draft.length<18)return draft;
  const last=[...turns].reverse().find(x=>x.r==='u');
  const q='Friend said: '+(last?last.t:'')+'\n\nDraft reply: '+draft;
  const raw=await withTimeout(run('gemini',[{r:'u',t:q}],{quick:true,sys:SI_FIX+siTone()}),5000);
  const t=cleanOut(String(raw)).replace(/^\s*(Draft reply|Final reply|Reply)\s*[:：]\s*/i,'');
  if(t&&t.length>2&&t.length<draft.length*2.2+40&&siOk(t)&&!badSi(t))return t;
 }catch(e){}
 return draft;
}
const SI_FIX=`You are a native Sri Lankan Sinhala editor. You get a friend's message and Yuki's draft reply. Rewrite ONLY the draft so it is natural, correct, colloquial spoken Sinhala (Sinhala script) as young Sri Lankans text, mixing English words where natural. Keep the meaning, the sassy sharp tone (keep ඔහේ / තමුසේ and the teasing bite, never make it polite or soft), the emojis and every name or number. Check every single word: it must be a real everyday Sinhala word, correctly spelled and correctly formed; remove any other-script characters. Fix spelling, grammar, made-up words and anything that does not make sense; replace odd phrases with simple natural ones, and make sure the reply actually answers what the friend said. Keep it 1-3 short sentences. If the draft is already perfect, return it unchanged. Output ONLY the final reply.
`+SI_HELP;
async function viaEnglish(turns){
 const all=order();
 if(!all.length||!hasKey())throw new Error('Add at least one API key in API Settings');
 const explicit=provider()!=='auto';
 const first=explicit?[all[0]]:(all.filter(p=>p!=='openrouter').length?all.filter(p=>p!=='openrouter'):all);
 const rest=all.filter(p=>!first.includes(p));
 const last=[...turns].reverse().find(x=>x.r==='u');
 let facts='';if(last&&needsFacts(last.t)){try{facts=await withTimeout(lookup(last.t),10000)}catch(e){}}
 const so=sys()+(facts?FACTS(facts):'');
 const errs=[];
 const wave=ps=>new Promise((res,rej)=>{
  let left=ps.length,done=false;
  ps.forEach(p=>{
   withTimeout(run(p,turns,{quick:true,sys:so}),25000).then(raw=>{
    const t=cleanOut(String(raw));
    if(!t)throw new Error('empty reply');
    if(isLoop(t))throw new Error('repeating reply');
    if(!done){done=true;srcP=p;res(t)}
   }).catch(e=>{errs.push(NAMES[p]+': '+((e&&e.message)||'failed'))}).finally(()=>{if(--left===0&&!done)rej(new Error('none'))});
  });
 });
 try{return await wave(first)}catch(e){}
 if(rest.length){try{return await wave(rest)}catch(e){}}
 throw new Error(errs.join(' | ')||'No AI provider replied');
}
async function fastAuto(turns,better){
 const all=avail(),main=all.filter(p=>p!=='openrouter'),ps=main.length?main:all;
 let backup=main.length&&all.includes('openrouter');
 const last=[...turns].reverse().find(x=>x.r==='u');
 let facts='';if(last&&needsFacts(last.t)){try{facts=await withTimeout(lookup(last.t),10000)}catch(e){}}
 const so=sys()+'\n\n'+SI_HELP+(facts?FACTS(facts):'');
 const hasG=ps.includes('gemini');
 return new Promise((res,rej)=>{
  let done=false,left=ps.length,gemFailed=false,pending=null,wt=null,upgraded=false;const errs=[];
  const give=(p,t)=>{if(done)return;done=true;if(wt)clearTimeout(wt);srcP=p;res(t);if(p!=='gemini'&&hasG)polish(t)};
  const upgrade=t=>{if(upgraded)return;upgraded=true;srcP='gemini';better(t)};
  const polish=draft=>{
   const q='Friend said: '+(last?last.t:'')+'\n\nDraft reply: '+draft;
   withTimeout(run('gemini',[{r:'u',t:q}],{quick:true,sys:SI_FIX+siTone()}),20000).then(raw=>{const t=cleanOut(String(raw));if(t&&siOk(t))upgrade(t)}).catch(()=>{});
  };
  const start=p=>{
   withTimeout(run(p,turns,{quick:true,sys:so}),22000).then(raw=>{
    const t=cleanOut(String(raw));
    if(!siOk(t))throw new Error('not Sinhala');
    if(p==='gemini'){proof(t,turns).then(t2=>{if(!done)give('gemini',t2);else upgrade(t2)})}
    else if(!done&&!pending){
     if(!hasG||gemFailed)give(p,t);
     else{pending={p,t};wt=setTimeout(()=>{if(!done&&pending)give(pending.p,pending.t)},5000)}
    }
   }).catch(e=>{errs.push(NAMES[p]+': '+((e&&e.message)||'failed'));if(p==='gemini'){gemFailed=true;if(pending&&!done)give(pending.p,pending.t)}}).finally(()=>{if(--left===0&&!done&&!pending){if(backup){backup=false;left=1;start('openrouter')}else rej(new Error(errs.join(' | ')))}});
  };
  ps.forEach(start);
 });
}

  const added=(typeof wish!=='undefined'&&Array.isArray(wish)?wish:[]).some(w=>String(w.name).toLowerCase()===String(r.name).toLowerCase());
  return '<div class="ycrc"><img src="'+esc(r.cover)+'" alt="" loading="lazy"><div class="ycrt"><b>'+esc(r.name)+'</b><small>'+(r.score?'⭐ '+(r.score/10).toFixed(1)+' · ':'')+esc(r.format||'')+(r.episodes?' · '+r.episodes+' ep':'')+'</small><small>'+esc((r.genres||[]).slice(0,3).join(', '))+'</small><button '+(added?'class="on" disabled':'onclick="ycAddRec('+i+','+k+')"')+'>'+(added?'✅ Added':'➕ Add to list')+'</button>'+(r.why?'<small class="ycwhy">🧠 '+esc(r.why)+'</small>':'<button type="button" class="ycw" onclick="ycWhy('+i+','+k+')">🧠 Why this?</button>')+'</div></div>';
 }).join('')+'</div>';
}
function renderMsgs(){
 const SRC={gemini:'✨',groq:'⚡',openrouter:'🌐'};
 return hist.map((x,i)=>{
  let h='<div class="ycm '+x.r+'"'+(x.r==='y'?' onclick="ycTap('+i+')"':'')+'>';
  if(x.img)h+='<img class="ycimg" src="'+esc(x.img)+'" alt="">';
  else if(x.pic)h+='<div style="font-size:.8rem;opacity:.7">📷 පින්තූරයක්</div>';
  h+=esc(String(x.t||'').replace(/\n[ \t]*\n+/g,'\n'));
  if(x.r==='y'&&x.src&&NAMES[x.src])h+='<span class="ycsrc s-'+x.src+'">'+SRC[x.src]+' '+NAMES[x.src]+'</span>';
  if(x.r==='y'&&openIdx===i)h+=actRow(i);
  if(x.gen)h+='<img class="ycgen" src="'+esc(x.gen.u)+'" alt="" loading="lazy"><div class="ycgact"><button type="button" onclick="event.stopPropagation();ycGenAgain('+i+')">🔄 Again</button><button type="button" onclick="event.stopPropagation();ycGenSave('+i+')">💾 Save</button><small>'+esc(x.gen.src||'')+'</small></div>';
  if(x.tm)h+='<div class="yctm">'+(x.tm.img?'<img src="'+esc(x.tm.img)+'" alt="" loading="lazy">':'')+'<div><b>'+esc(x.tm.title)+'</b><small>'+(x.tm.ep?'Episode '+esc(x.tm.ep)+(x.tm.at?' · '+mmss(x.tm.at):''):'Scene match')+'</small><small>Match '+x.tm.sim+'% · trace.moe</small></div></div>';
  h+='</div>';
  if(x.opts&&x.opts.length)h+='<div class="ycopts">'+x.opts.map((o,k)=>'<button type="button" onclick="ycQuick('+i+','+k+')">'+esc(o.l)+'</button>').join('')+'</div>';
  if(x.recs&&x.recs.length)h+=recCards(x.recs,i);
  return h;
 }).join('')+(busy?'<div class="ycm y yct" role="status" aria-label="Yuki is typing"><i></i><i></i><i></i><span>Yuki is typing…</span></div>':'');
}

window.ycRegen=async function(i,p){
 const x=hist[i];if(!x||busy||x.tpl)return;
 let j=i-1;while(j>=0&&hist[j].r!=='u')j--;if(j<0)return;
 const last=hist[j];
 if(last.pic&&!last.imgFull){try{toast('📷 පින්තූරය මතකයේ නෑ, ආයෙත් එවන්න')}catch(e){}return}
 const turns=hist.slice(0,j+1).filter(t=>t.r==='u'||t.r==='y').slice(-20);
 const m=document.getElementById('ycMsgs'),st=m?m.scrollTop:0;
 const oldT=x.t,oldS=x.src;
 busy=true;openIdx=-1;const my=++reqId;document.getElementById('ycSend').disabled=true;
 x.t='…';x.src='';keepScroll=st;draw();
 let out='',le=null;srcP='';
 try{
  if(x.recs&&x.recs.length)xtra=recHint(x.recs,'');
  if(last.pic){out=await viaImage(last.t,{full:last.imgFull});srcP='gemini'}
  else if(p){out=cleanOut(await withTimeout(run(p,turns,{sys:sys()+(LG()==='si'?'\n\n'+SI_HELP+siTone():'')}),30000));srcP=p}
  else out=await reply(turns);
 }catch(e){le=e}
 xtra='';
 if(my!==reqId)return;
 busy=false;document.getElementById('ycSend').disabled=false;
 if(out){x.t=out;x.src=srcP||p||''}else{x.t=oldT;x.src=oldS;try{toast('⚠️ '+((le&&le.message)||'ආයෙත් generate කරන්න බැරි වුණා'))}catch(e){}}
 saveH();keepScroll=st;draw();
};

/* --- voice --- */
window.ycSpeak=function(i){
 const x=hist[i],sy=window.speechSynthesis;
 if(!x||!sy||typeof SpeechSynthesisUtterance==='undefined'){try{toast('🔇 Text-to-speech is not supported in this browser. Try Chrome and check Android Text-to-speech settings.')}catch(e){}return}
 try{
  sy.cancel();
  const text=String(x.t||'').replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,'').trim();
  if(!text)return;
  const speak=()=>{
   const u=new SpeechSynthesisUtterance(text);u.lang=LG()==='si'?'si-LK':'en-US';u.rate=0.95;u.pitch=1.05;
   const vs=sy.getVoices?sy.getVoices():[];
   const v=LG()==='si'?vs.find(v=>/^si(-|_)/i.test(v.lang)):(vs.find(v=>/^en(-|_)/i.test(v.lang)&&/google|english|natural/i.test(v.name))||vs.find(v=>/^en(-|_)/i.test(v.lang)));
   if(v)u.voice=v;
   u.onerror=()=>{try{toast('🔇 Voice playback failed. Check Android Text-to-speech output settings.')}catch(e){}};
   sy.speak(u);
   setTimeout(()=>{if(sy.paused)sy.resume()},250);
  };
  if(sy.getVoices&&sy.getVoices().length)speak();
  else{let done=false;const go=()=>{if(done)return;done=true;try{sy.removeEventListener('voiceschanged',go)}catch(e){}speak()};try{sy.addEventListener('voiceschanged',go)}catch(e){}setTimeout(go,700)}
 }catch(e){try{toast('🔇 Could not start voice playback. Check Android Text-to-speech settings.')}catch(_){}}
};
let sr=null,srOn=false;
window.ycMic=function(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){try{toast('🎤 Voice input needs Chrome and microphone permission')}catch(e){}return}
 if(srOn&&sr){try{sr.stop()}catch(e){}return}
 const b=document.getElementById('ycMic'),inp=document.getElementById('ycIn'),base=inp.value?inp.value+' ':'';
 sr=new SR();sr.lang=LG()==='si'?'si-LK':'en-US';sr.interimResults=true;sr.continuous=false;sr.maxAlternatives=1;
 sr.onstart=()=>{srOn=true;b.classList.add('on');b.textContent='⏹️'};
 sr.onresult=e=>{let t='';for(let k=0;k<e.results.length;k++)t+=e.results[k][0].transcript;inp.value=base+t};
 sr.onerror=e=>{try{toast(e.error==='not-allowed'?'🎤 Allow microphone permission in Android settings':e.error==='language-not-supported'?T('🎤 සිංහල voice input මේ phone එකේ support නෑ, English තෝරන්න','🎤 English voice input is not supported on this phone'):'🎤 Could not hear clearly. Check mic permission and try again')}catch(x){}};
 sr.onend=()=>{srOn=false;b.classList.remove('on');b.textContent='🎤';inp.focus()};
 try{sr.start()}catch(e){}
};

window.ycFilePicked=function(f){
 const file=f.files&&f.files[0];f.value='';if(!file)return;
 if(!/^image\//.test(file.type)){try{toast('Please choose an image file')}catch(e){}return}
 const rd=new FileReader();
 rd.onload=()=>{const im=new Image();
  im.onload=()=>{
   const sc=Math.min(1,896/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
   const ts=Math.min(1,160/Math.max(im.width,im.height)),tc=document.createElement('canvas');tc.width=Math.round(im.width*ts);tc.height=Math.round(im.height*ts);tc.getContext('2d').drawImage(im,0,0,tc.width,tc.height);
   pendImg={full:cv.toDataURL('image/jpeg',0.82).split(',')[1],thumb:tc.toDataURL('image/jpeg',0.7)};updPrev();
   const inp=document.getElementById('ycIn');inp.placeholder='Which anime is this? (you can ask anything)';inp.focus();
  };
  im.onerror=()=>{try{toast('පින්තූරය කියවන්න බැරි වුණා')}catch(e){}};im.src=rd.result};
 rd.readAsDataURL(file);
};
async function viaImage(txt,img){
 const key=gm();if(!key)throw new Error('පින්තූරයකට Gemini key එකක් ඕනේ (🔑 එකෙන් දාන්න)');
 const so=sys()+'\n\nHe just sent you an image (usually an anime screenshot). Look at it carefully and answer in '+(LG()==='si'?'natural, casual Sri Lankan Sinhala (Sinhala script, with anime titles kept in English)':'clear, casual English')+'. First read any visible text (name tags, subtitles, logos, watermarks). If it is from an anime, manga or game, say the title, the character name (if you can tell) and, in one short clause, the clue you used (hair, outfit, visible text). Add a confidence word (sure / probably / not sure). Answer exactly what he asked (the character, the anime, or the scene). If it shows a real person, do not identify them, only describe what is visible. If you are not sure, say so and give your best guess; never invent titles. For translation requests, translate/explain the image directly; do not add a generic teasing question at the end. Avoid repeating the same closing tease used in recent Yuki messages. 1-3 short sentences, no nagging. '+(LG()==='si'?'Follow these Sinhala writing rules: '+SI_HELP:'');
 const tt=hist.filter(t=>t.r==='u'||t.r==='y');const tl=tt.slice(-9);const c=[];
 tl.forEach((t,k)=>{const r=t.r==='u'?'user':'model';const parts=[{text:t.t}];if(k===tl.length-1&&r==='user')parts.push({inlineData:{mimeType:'image/jpeg',data:img.full}});if(c.length&&c[c.length-1].role===r)c[c.length-1].parts=c[c.length-1].parts.concat(parts);else c.push({role:r,parts})});
 while(c.length&&c[0].role!=='user')c.shift();
 if(!c.length)c.push({role:'user',parts:[{text:txt},{inlineData:{mimeType:'image/jpeg',data:img.full}}]});
 let le;
 for(const m of GEM_MODELS){
  try{
   const d=await post('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{'x-goog-api-key':key},{systemInstruction:{parts:[{text:so}]},contents:c,generationConfig:Object.assign({temperature:0.4,maxOutputTokens:700},/^gemini-2\.5-flash$/.test(m)?{thinkingConfig:{thinkingBudget:0}}:{})},60000);
   const t=cleanOut((d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''));
   if(t)return t;le=new Error('Empty reply from Gemini');
  }catch(e){le=e;if(!(e.nf||e.busy||/timed out|timeout|network error/i.test(e.message||'')))break}
 }
 throw le;
}

const REC_RE=/recommend|suggest|රෙකමන්ඩ්|මොනවද බලන්නේ|මොනවා බලන්න|බලන්න ඕනේ|බලන්න anime|ගැළපෙන|ගැලපෙන/i;
const moodOf=t=>{for(const m of MOODS)if(m[0].test(t))return m;return null};
const isRecAsk=t=>{const m=moodOf(t);return REC_RE.test(t)||!!(m&&/ඕනේ|ඕන\b|anime|ඇනිමේ|අද|බලන්න|recommend/i.test(t))};
async function fetchRecs(t){
 const m=moodOf(t);let g=m?m[1]:(typeof topGenres==='function'?topGenres().slice(0,2):[]);if(!g.length)g=['Comedy'];
 const q='query($g:[String],$p:Int){Page(page:$p,perPage:16){media(type:ANIME,genre_in:$g,sort:POPULARITY_DESC,isAdult:false,format_in:[TV,TV_SHORT,MOVIE,OVA,ONA]){id title{english romaji}coverImage{large}episodes format averageScore genres}}}';
 try{
  const d=await aq(q,{g,p:1+Math.floor(Math.random()*3)});const arr=d?.data?.Page?.media||[];
  const have=new Set((animeList||[]).map(a=>String(a.name).toLowerCase()).concat((Array.isArray(wish)?wish:[]).map(w=>String(w.name).toLowerCase())));
  let fb=false;let arr2=arr;
  if(!arr2.length&&typeof window.anilistPage==='function'){try{const r=await window.anilistPage({genres:g});if(r&&r.length){arr2=r;fb=true}}catch(e){}}
  const ok=arr2.filter(x=>{const n=(x.title.english||x.title.romaji||'').toLowerCase();return n&&!have.has(n)&&(fb||(x.averageScore||0)>=65)});
  for(let i=ok.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ok[i],ok[j]]=[ok[j],ok[i]]}
  return{mood:m?m[2]:'',items:ok.slice(0,3)};
 }catch(e){return null}
}
const recHint=(rs,mood)=>{const names=rs.map(r=>r.title?(r.title.english||r.title.romaji):r.name).join(', ');return '\n\nRECOMMENDATION MODE: he is asking for anime recommendations'+(mood?' for this mood: '+mood:'')+'. The app is showing cards for exactly these titles: '+names+'. In 1-2 short in-character sentences say you picked them for him and mention at least one by name (keep titles in English letters). Do not tell him to finish or catch up on anything else.'};

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

 if(s.length>260){s=s.slice(0,260);const k=s.lastIndexOf('. ');s=k>120?s.slice(0,k+1):s.replace(/\s+\S*$/,'')+'…'}

function ycQuizDuplicate(candidate){
 const norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
 const words=v=>new Set(norm(v).split(' ').filter(w=>w.length>2));

  if(m.r!=='y'||!m.t||(!m.t.includes('❓')&&!m.t.includes('Quiz time')&&!m.t.includes('quiz එකක් කරමු')))continue;
  const matches=[...String(m.t).matchAll(/[“"]([^”"]{8,180})[”"]/g)].map(x=>x[1]);
  for(const q of matches){
   const b=words(q); if(!b.size)continue;
   let common=0; for(const w of a)if(b.has(w))common++;
   const similarity=common/Math.min(a.size,b.size);
   if(norm(q)===norm(candidate)||similarity>=0.72)return true;
  }
 }
 return false;
}

/* AI Horde: free community GPUs, no key (anonymous), but it can queue for a minute or two */

 if(!r.ok)throw await errOf(r);
 const j=await r.json();if(!j.id)throw new Error('no job id');
 const t0=Date.now();
 while(Date.now()-t0<150000){
  await new Promise(x=>setTimeout(x,4000));
  const c=await imgFetch('https://aihorde.net/api/v2/generate/check/'+j.id,{headers:HDR},20000);
  if(!c.ok)throw await errOf(c);
  const cj=await c.json();if(cj.faulted)throw new Error('job faulted');
  if(cj.done){
   const st=await (await imgFetch('https://aihorde.net/api/v2/generate/status/'+j.id,{headers:HDR},30000)).json();
   const g=st.generations&&st.generations[0];if(!g||!g.img||g.censored)throw new Error(g&&g.censored?'censored':'no image');
   let u=g.img;if(!/^(data:|https?:)/.test(u))u='data:image/webp;base64,'+u;
   if(/^https?:/.test(u)){try{u=await blobToUrl(await (await imgFetch(u,{},40000)).blob())}catch(e){}}
   return await shrink(u,640);
  }
 }
 try{fetch('https://aihorde.net/api/v2/generate/status/'+j.id,{method:'DELETE',headers:HDR})}catch(e){}
 throw new Error('timed out in queue');
}

 return`<div class="ac26${a.category==='dropped'?' drp':''}" onclick="openDetailsModal(${i})"><div class="acp"><img src="${esc(a.cover||PH)}" alt="" loading="lazy" decoding="async"><div class="acbs"><span class="acb st">${a.category==='ongoing'?'Ongoing':(CATL[a.category]||'')}</span>${m?'':`<span class="acpc">${p}%</span>`}</div>${(m?a.watched>0:(a.category==='completed'||(a.total>0&&a.watched>=a.total)))?'<span class="acwt"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Watched</span>':''}</div><div class="acm"><div class="rt">${esc(a.name)}</div><div class="acalt">${a.alt?esc(a.alt):'&nbsp;'}</div><div class="acg">${meta}${a.score?` · <b>★ ${esc(a.score)}</b>`:''}</div>${chips?`<div class="acc">${chips}</div>`:''}${m?`<div class="acep"><div class="acn">${num}</div></div>`:`<div class="acg acse">❄️ ${a.seasonsCount||1} Seasons · 📊 ${a.watched||0}/${a.total||'?'} eps</div>`}${xtra(a)}${m?'':leftChip(a)+pips(a)}<div class="aca" onclick="event.stopPropagation()">${acts}<button onclick="openEditModal(${i})">✏️ Edit</button></div></div></div>`};

<script id="yuki-polish-js">(function(){

function fix(i){try{if(!i.decoding)i.decoding='async';if(!i.loading&&!i.closest('#splash'))i.loading='lazy'}catch(e){}}
try{var m=document.getElementById('main');if(m){[].forEach.call(m.querySelectorAll('img'),fix);
new MutationObserver(function(l){l.forEach(function(r){[].forEach.call(r.addedNodes,function(n){if(n.nodeType!==1)return;if(n.tagName==='IMG')fix(n);else if(n.querySelectorAll)[].forEach.call(n.querySelectorAll('img'),fix)})})}).observe(m,{childList:true,subtree:true})}}catch(e){}
})();</script>
<script id="yuki-guard">/* v45.8 · crash guard: one broken widget can no longer leave the dashboard stuck on loading placeholders */

try{if(typeof animeList!=='undefined'&&animeList&&document.querySelector('#main .skg'))window.render()}catch(e){}
})();

<script>/* v45.18 · remote control from GitHub Pages: yuki-config.json (settings + notice + app build) and OTA page update */
(function(){
var B=window.YUKI_BUILD||'0',H=(function(){try{return localStorage.getItem('yukiHost')}catch(e){return null}})()||'https://tharindu2010bro-cmd.github.io/Yuki/';
H=H.replace(/\/?$/,'/');
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function cmp(a,b){a=String(a).split('.');b=String(b).split('.');for(var i=0;i<4;i++){var x=+a[i]||0,y=+b[i]||0;if(x!==y)return x>y?1:-1}return 0}
var box='position:fixed;z-index:2147483647;pointer-events:auto;';
function restart(){try{var o=JSON.parse(ls('yukiOta_v1')||'null');if(o&&o.html&&cmp(o.build,B)>0){ls('yukiOtaTry','1');document.open();document.write(o.html);document.close();return}}catch(e){}location.reload()}
function btn(t,f,p){var b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;margin:'+(p||'0 8px 0 0')+';background:var(--p,#c084fc);color:#10091c';b.onclick=f;return b}
function notice(n){
  if(!n||!n.id||!(n.title||n.text)||ls('yukiNoticeSeen')===String(n.id))return;
  var d=document.createElement('div');d.style.cssText=box+'inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,5,8,.72)';
  var c=document.createElement('div');c.style.cssText='max-width:340px;width:100%;background:var(--sheet,#12131f);color:var(--t,#eceaf7);border:1px solid var(--b,#333);border-radius:20px;padding:20px';
  var h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.1rem;margin-bottom:8px';h.textContent=n.title||'Yuki';
  var p=document.createElement('div');p.style.cssText='margin-bottom:14px;white-space:pre-wrap';p.textContent=n.text||'';
  c.appendChild(h);c.appendChild(p);
  if(/^https:\/\//.test(n.url||''))c.appendChild(btn('Open',function(){window.open(n.url,'_blank')}));
  c.appendChild(btn('Got it',function(){ls('yukiNoticeSeen',String(n.id));d.remove()},'0'));
  d.appendChild(c);document.body.appendChild(d)}
function bar(msg,label,fn){
  var d=document.createElement('div');d.style.cssText=box+'left:12px;right:12px;bottom:84px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--sheet,#12131f);color:var(--t,#eceaf7);border:1px solid var(--p,#c084fc)';
  var s=document.createElement('span');s.textContent=msg;d.appendChild(s);d.appendChild(btn(label,fn,'0'));document.body.appendChild(d);return d}
function ready(nb){var o=document.getElementById('yReady');if(o)o.remove();var d=bar('Update '+nb+' is ready','Restart',restart);d.id='yReady'}
function toast(m){var d=document.createElement('div');d.style.cssText=box+'left:12px;right:12px;bottom:84px;padding:12px 14px;border-radius:16px;text-align:center;background:var(--sheet,#12131f);color:var(--t,#eceaf7);border:1px solid var(--b,#333)';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function ota(nb,cb,fail){
  try{var o=ls('yukiOta_v1');if(o&&JSON.parse(o).build===nb){(cb||ready)(nb);return}}catch(e){}
  fetch(H+'index.html?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():Promise.reject()}).then(function(t){
    if(t.length<200000||t.indexOf('</html>')<0||t.indexOf("YUKI_BUILD='"+nb+"'")<0)throw 0;
    ls('yukiOta_v1',JSON.stringify({build:nb,html:t}));
    if(!ls('yukiOta_v1'))throw 0;(cb||ready)(nb)}).catch(function(){if(fail)fail()})}
function lockUI(id,title,text,acts){
  var d=document.getElementById(id);if(!d){d=document.createElement('div');d.id=id;d.style.cssText=box+'inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg,#080910);color:var(--t,#eceaf7);text-align:center';document.body.appendChild(d)}
  d.textContent='';var c=document.createElement('div');c.style.cssText='max-width:340px';
  var h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.3rem;margin-bottom:10px';h.textContent=title;
  var p=document.createElement('div');p.style.cssText='margin-bottom:18px;white-space:pre-wrap';p.textContent=text;
  c.appendChild(h);c.appendChild(p);(acts||[]).forEach(function(a){c.appendChild(btn(a[0],a[1],'4px'))});d.appendChild(c)}
function unlock(id){var d=document.getElementById(id);if(d)d.remove()}
function maint(m){lockUI('yMaint',m.title||'Under maintenance',m.text||'Yuki will be back soon.',[])}
function applyFlags(f){
  f=f||{};var css='';
  if(f.ai===false)css+='#ycBtn,#ycWrap{display:none!important}';
  if(f.quiz===false)css+='[onclick^="ycQuiz"]{display:none!important}';
  if(f.news===false)css+='[data-v="news"],[onclick*="go(\'news\')"]{display:none!important}';
  var st=document.getElementById('yFlagCss');if(!st){st=document.createElement('style');st.id='yFlagCss';document.head.appendChild(st)}st.textContent=css;
  window.__yOff={ai:f.ai===false,quiz:f.quiz===false,news:f.news===false};
  if(!window.__goW&&typeof window.go==='function'){var g=window.go;window.go=function(v){if(v==='news'&&window.__yOff.news)return;return g.apply(this,arguments)};window.__goW=1}
  if(!window.__qzW&&typeof window.ycQuiz==='function'){var q=window.ycQuiz;window.ycQuiz=function(){if(window.__yOff.quiz)return;return q.apply(this,arguments)};window.__qzW=1}}
function force(a){
  var nb=String(a.build||a.min),o=null;try{o=JSON.parse(ls('yukiOta_v1')||'null')}catch(e){}
  var rdy=o&&cmp(o.build,B)>0,link=/^https:\/\//.test(a.url||'')?[['Download update',function(){window.open(a.url,'_blank')}]]:[];
  if(rdy){lockUI('yForce','Update required','The new version is ready.',[['Restart',restart]]);return}
  lockUI('yForce','Update required','This version is too old. Downloading the update…',[]);
  ota(nb,function(){force(a)},function(){lockUI('yForce','Update required','Could not download the update automatically.',link)})}
function logoCss(l){
  var st=document.getElementById('yLogoCss');
  if(!l||!l.url){if(st)st.remove();return}
  var u=/^https:\/\//.test(l.url)?l.url:H+String(l.url).replace(/^\/+/,'');
  u+=(u.indexOf('?')<0?'?':'&')+'v='+encodeURIComponent(l.v||'1');
  if(!st){st=document.createElement('style');st.id='yLogoCss';document.head.appendChild(st)}
  st.textContent='#main .hh:not(.ph) .av.lg,#topAv{background-image:url("'+u.replace(/"/g,'')+'")!important;background-size:cover!important;background-position:center!important}'}
function apply(c){
  if(!c)return;
  try{if(c.logo&&c.logo.url){ls('yukiLogo_v1',JSON.stringify(c.logo));logoCss(c.logo)}else{ls('yukiLogo_v1',null);logoCss(null)}}catch(e){}
  var fl=c.flags||{};ls('yukiFlags_v1',JSON.stringify(fl));applyFlags(fl);
  if(c.maintenance&&c.maintenance.on){ls('yukiMaint_v1',JSON.stringify({t:Date.now(),title:c.maintenance.title,text:c.maintenance.text}));maint(c.maintenance)}else{ls('yukiMaint_v1',null);unlock('yMaint')}
  if(c.app&&c.app.min&&cmp(c.app.min,B)>0)force(c.app);else unlock('yForce');
  if(+c.v>+(ls('yukiCfgV')||0)){
    if(c.sources)ls('yukiApi_v1',JSON.stringify({off:c.sources.off||[],order:c.sources.order||[]}));
    if(typeof c.proxy==='string'&&c.proxy.indexOf('https://')===0&&c.proxy!==ls('yukiProxy')){ls('yukiProxy',c.proxy);try{window.yukiSetWorker&&yukiSetWorker(c.proxy)}catch(e){}}
    ls('yukiCfgV',String(c.v));try{window.yukiResetDead&&yukiResetDead()}catch(e){}}
  notice(c.notice);
  if(c.app&&c.app.build&&cmp(c.app.build,B)>0&&ls('yukiOtaFail')!==String(c.app.build))ota(String(c.app.build))}
/* auto update: read only the first KB of the hosted index.html to learn its build number, download the page only when it is newer */
function peek(){
  return fetch(H+'index.html?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok||!r.body||!r.body.getReader)return Promise.reject();
    var rd=r.body.getReader(),dec=new TextDecoder(),acc='';
    function step(){return rd.read().then(function(x){
      if(x.value)acc+=dec.decode(x.value,{stream:true});
      var m=/YUKI_BUILD='([0-9.]+)'/.exec(acc);
      if(m){try{rd.cancel()}catch(e){}return m[1]}
      if(x.done||acc.length>20000){try{rd.cancel()}catch(e){}return null}
      return step()})}
    return step()})}
function autoCheck(manual){
  if(!manual&&Date.now()-(+ls('yukiPeekAt')||0)<30*60*1000)return;
  ls('yukiPeekAt',String(Date.now()));
  peek().then(function(b){
    if(b&&cmp(b,B)>0){if(ls('yukiOtaFail')===b&&!manual)return;if(manual)ls('yukiOtaFail',null);if(manual)toast('Downloading update '+b+'…');ota(b,null,function(){if(manual)toast('Download failed, try again later')})}
    else if(manual)toast('You are up to date (v'+B+')')
  }).catch(function(){if(manual)toast('Could not reach the update server')})}
window.yukiCheckUpdate=function(){autoCheck(true)};
function pull(){fetch(H+'yuki-config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(apply).catch(function(){})}
addEventListener('load',function(){setTimeout(function(){ls('yukiOtaTry',null);pull();autoCheck()},3000)});
setInterval(function(){if(!document.hidden){pull();autoCheck()}},30*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-(+ls('yukiPullAt')||0)>10*60*1000){ls('yukiPullAt',String(Date.now()));pull();autoCheck()}});
window.yukiPull=pull;
try{logoCss(JSON.parse(ls('yukiLogo_v1')||'null'))}catch(e){}
try{applyFlags(JSON.parse(ls('yukiFlags_v1')||'{}'));var mm=JSON.parse(ls('yukiMaint_v1')||'null');if(mm&&Date.now()-mm.t<864e5)maint(mm)}catch(e){}
})();</script>
