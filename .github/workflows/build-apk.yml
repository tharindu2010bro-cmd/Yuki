name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yuki-debug-keystore-v1

      - run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f bridge.js ] && cp bridge.js www/bridge.js || true
          [ -f status.html ] && cp status.html www/status.html || true

      - name: Apply tweaks
        run: python3 tweaks.py

      - run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          ICON=icon.png
          [ -f "$ICON" ] || ICON=$(ls *.png 2>/dev/null | grep -v '^logo.png$' | head -n1)
          if [ -n "$ICON" ]; then
            mkdir -p assets
            cp "$ICON" assets/icon-only.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0a1040'
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - run: npx cap sync android

      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Remove unused logo files
        continue-on-error: true
        run: |
          # delete only files that nothing in the project references
          # icon.png is never touched (the APK icon is built from it)
          REFS="index.html bridge.js status.html tweaks.py capacitor.config.json package.json README.md"
          DEL=""
          for f in logo.png file_0000*; do
            [ -f "$f" ] || continue
            if grep -qsF -- "$f" $REFS; then
              echo "keep $f (referenced)"
            else
              DEL="$DEL $f"
            fi
          done
          if [ -n "$DEL" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -q -- $DEL
            git commit -q -m "chore: remove unused logo files"
            git pull -q --rebase origin main || true
            git push -q origin HEAD:main
            echo "removed:$DEL"
          else
            echo "nothing to remove"
          fi
