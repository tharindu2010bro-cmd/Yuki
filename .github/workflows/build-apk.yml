name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yuki-debug-keystore-v1

      - run: npm install

      - name: Splash screen plugin (keeps the branded launch splash until the page paints)
        continue-on-error: true
        run: |
          V=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor major: $V"
          npm install @capacitor/splash-screen@$V --no-audit --no-fund

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f bridge.js ] && cp bridge.js www/bridge.js || true
          [ -f status.html ] && cp status.html www/status.html || true

      - name: Apply tweaks
        run: python3 tweaks.py
      - name: Dark launch colours (app loads the bundled page, not GitHub Pages)
        run: |
          python3 - <<'PYEOF'
          import json, os
          p = 'capacitor.config.json'
          c = json.load(open(p)) if os.path.exists(p) else {"appId": "com.yuki.tracker", "appName": "Yuki", "webDir": "www"}
          c.pop('server', None)   # no server.url: the page inside the APK (www/index.html, patched by tweaks.py) is used
          c['backgroundColor'] = '#080910'
          c.setdefault('android', {})['backgroundColor'] = '#080910'
          sp = c.setdefault('plugins', {}).setdefault('SplashScreen', {})
          sp['backgroundColor'] = '#080910'
          sp['showSpinner'] = False
          sp['launchAutoHide'] = True      # safety net: always hides by itself
          sp['launchShowDuration'] = 3000  # the page hides it earlier, as soon as its own splash is painted
          sp['launchFadeOutDuration'] = 200
          json.dump(c, open(p, 'w'), indent=2)
          PYEOF

      - run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          ICON=icon.png
          [ -f "$ICON" ] || ICON=$(ls *.png 2>/dev/null | grep -v '^logo.png$' | head -n1)
          if [ -n "$ICON" ]; then
            mkdir -p assets
            cp "$ICON" assets/icon-only.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0a1040'
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - run: npx cap sync android

      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M

      - name: Dark launch theme (no grey flash)
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import re, os
          p = 'android/app/src/main/res/values/styles.xml'
          if not os.path.exists(p):
              print('styles.xml not found, skipping'); raise SystemExit
          s = open(p, encoding='utf-8').read()
          BG = '#080910'
          def span(s, name):
              m = re.search(r'<style\s+name="%s"[^>]*>' % re.escape(name), s)
              if not m: return None
              e = s.find('</style>', m.end())
              return (m.end(), e) if e > 0 else None
          def add(s, name, key, val):
              sp = span(s, name)
              if not sp: return s
              a, e = sp
              if 'name="%s"' % key in s[a:e]:
                  return s[:a] + re.sub(r'(<item\s+name="%s">)[^<]*(</item>)' % re.escape(key), r'\g<1>%s\g<2>' % val, s[a:e]) + s[e:]
              return s[:a] + '\n        <item name="%s">%s</item>' % (key, val) + s[a:]
          s = add(s, 'AppTheme.NoActionBar', 'android:windowBackground', BG)
          s = add(s, 'AppTheme.NoActionBarLaunch', 'android:windowBackground', BG)
          m = re.search(r'<style\s+name="AppTheme.NoActionBarLaunch"[^>]*>', s)
          if m and 'Theme.SplashScreen' in m.group(0):
              s = add(s, 'AppTheme.NoActionBarLaunch', 'windowSplashScreenBackground', BG)
          s = s.replace('<item name="android:background">@drawable/splash</item>', '<item name="android:background">%s</item>' % BG)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched styles.xml')
          PYEOF

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Remove unused logo files
        continue-on-error: true
        run: |
          # delete only files that nothing in the project references
          # icon.png is never touched (the APK icon is built from it)
          REFS="index.html bridge.js status.html tweaks.py capacitor.config.json package.json README.md"
          DEL=""
          for f in logo.png file_0000*; do
            [ -f "$f" ] || continue
            if grep -qsF -- "$f" $REFS; then
              echo "keep $f (referenced)"
            else
              DEL="$DEL $f"
            fi
          done
          if [ -n "$DEL" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -q -- $DEL
            git commit -q -m "chore: remove unused logo files"
            git pull -q --rebase origin main || true
            git push -q origin HEAD:main
            echo "removed:$DEL"
          else
            echo "nothing to remove"
          fi
