name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yuki-debug-keystore-v1

      - run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f bridge.js ] && cp bridge.js www/bridge.js || true
          [ -f status.html ] && cp status.html www/status.html || true

      - name: Apply tweaks
        run: python3 tweaks.py

      - run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          ICON=$(ls *.png 2>/dev/null | head -n1)
          if [ -n "$ICON" ]; then
            mkdir -p assets
            cp "$ICON" assets/icon-only.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0a1040'
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - run: npx cap sync android

      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
