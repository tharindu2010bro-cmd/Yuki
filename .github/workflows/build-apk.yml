name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yuki-debug-keystore-v1

      - run: npm install

      - name: Inject native bridge into index.html (build only)
        run: |
          cp bridge.js www/bridge.js
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          i = s.find('<head>')
          if i < 0:
              raise SystemExit('<head> not found in www/index.html')
          s = s[:i+6] + '<script src="bridge.js"></script>' + s[i+6:]
          open(p, 'w', encoding='utf-8').write(s)
          PY

       - name: Bundle images into the app
        continue-on-error: true
        run: |
          mkdir -p www/img
          python3 - <<'PY'
          import urllib.request
          U = {
            'bg.png': 'https://i.ibb.co/cKHsySXs/upscaled-4k-143280.png',
            'welcome.png': 'https://i.ibb.co/zVX9YvRJ/143272.png',
            'nf.png': 'https://i.ibb.co/1f5KKn3q/144244.png'}
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          for n, u in U.items():
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  d = urllib.request.urlopen(req, timeout=60).read()
                  if len(d) > 1000:
                      open('www/img/' + n, 'wb').write(d)
                      s = s.replace(u, '/img/' + n)
                      print('ok', n, len(d))
              except Exception as e:
                  print('fail', n, e)
          open(p, 'w', encoding='utf-8').write(s)
          PY     
- run: npx cap add android

      - name: App icon
        continue-on-error: true
        run: |
          ICON=$(ls *.png 2>/dev/null | head -n1)
          if [ -n "$ICON" ]; then
            mkdir -p assets
            cp "$ICON" assets/icon-only.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0a1040'
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - run: npx cap sync android

      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk